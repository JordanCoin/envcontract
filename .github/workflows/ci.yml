name: CI

# Public repo: GitHub-hosted runners are free here, so no self-hosted runner needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The bundled dist/ is committed; prove it is in sync with src/.
      - run: pnpm build
      - name: dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is stale. Run 'pnpm build' and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi
